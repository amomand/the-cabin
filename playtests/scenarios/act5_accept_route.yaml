name: act5_accept_route
surface: web
description: From the dawn-offer seed, drink the blue-mug coffee. The stayed ending must fire from its authored beat, and the trailing look must find a closed session rather than a room.
offline_ai: true
commands:
  - load act5_dawn
  - look
  - drink up
  - look
required_phrases:
  - Your thumb finds the chip
  - First light does not come
  - You are home.
  - Health:
expected_state:
