<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Cabin — No Further</title>
  <style>
    /* Fallback book face for devices without Iowan Old Style; fetched only when used. */
    @font-face {
      font-family: "Literata";
      font-style: normal;
      font-weight: 200 900;
      font-display: swap;
      src: url("assets/fonts/literata-latin.woff2") format("woff2");
    }

    @font-face {
      font-family: "Literata";
      font-style: italic;
      font-weight: 200 900;
      font-display: swap;
      src: url("assets/fonts/literata-latin-italic.woff2") format("woff2");
    }

    :root {
      --bg: #0a0a0a;
      --text: #e4dfd5;
      --prose: #d3cec4;
      --muted: #a8a399;
      --dim: #85817a;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Iowan Old Style", "Literata", "Palatino Linotype", Palatino, Georgia, serif;
      line-height: 1.65;
      overflow-x: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.12'/></svg>");
      opacity: 0.03;
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 10vh 7vw 12vh;
    }

    header {
      margin-bottom: 6vh;
    }

    h1 {
      margin: 0 0 0.2em 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 400;
      letter-spacing: -0.005em;
    }

    .subtitle {
      margin: 0 0 2em 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      gap: 1.4rem;
      flex-wrap: wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    nav a {
      color: var(--dim);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 0.15em;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    nav a:hover,
    nav a:focus {
      color: var(--text);
      border-color: var(--text);
    }

    .story {
      max-width: 33em;
      font-size: 1.1875rem;
      color: var(--prose);
    }

    .story p {
      margin: 0;
      text-indent: 1.6em;
    }

    .story p:first-child,
    .story .scene-break + p {
      text-indent: 0;
    }

    .story .scene-break {
      margin: 2.2em 0;
      text-indent: 0;
      text-align: center;
      color: var(--dim);
      letter-spacing: 0.4em;
    }

    .fallback {
      color: var(--muted);
    }

    .back-link {
      margin-top: 3vh;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .back-link a {
      color: var(--dim);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 0.15em;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .back-link a:hover,
    .back-link a:focus {
      color: var(--text);
      border-color: var(--text);
    }

    @media (max-width: 600px) {
      .page {
        padding-top: 9vh;
      }

      .story {
        font-size: 1.0625rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>No Further</h1>
      <p class="subtitle">Story</p>
      <nav>
        <a href="index.html">Home</a>
        <a href="game.html">Game</a>
        <a href="stories.html">Stories</a>
        <a href="https://github.com/amomand/the-cabin">Repository</a>
      </nav>
    </header>

    <article id="story-content" class="story">
      <p class="fallback">Loading text...</p>
    </article>
    <div class="back-link">
      <a href="stories.html">Back to Stories</a>
    </div>
  </div>

  <script>
    (() => {
      const target = document.getElementById("story-content");
      const escapeHtml = (value) =>
        value.replace(/[&<>"']/g, (ch) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#39;",
        }[ch]));

      fetch("stories/no-further.md")
        .then((response) => {
          if (!response.ok) {
            throw new Error("story fetch failed");
          }
          return response.text();
        })
        .then((text) => {
          const trimmed = text.trim();
          if (!trimmed) {
            target.innerHTML = "<p>Text unavailable.</p>";
            return;
          }
          const paragraphs = trimmed
            .split(/\n\s*\n/)
            .map((block) => block.replace(/\n+/g, " ").trim())
            .filter(Boolean);
          target.innerHTML = paragraphs
            .map((paragraph) => {
              if (paragraph === "*") {
                return '<p class="scene-break">*</p>';
              }
              const html = escapeHtml(paragraph).replace(
                /\*([^*]+)\*/g,
                "<em>$1</em>"
              );
              return `<p>${html}</p>`;
            })
            .join("");
        })
        .catch(() => {
          target.innerHTML = "<p>Text unavailable.</p>";
        });
    })();
  </script>
</body>
</html>
