<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Cabin — Stories</title>
  <style>
    /* Fallback book face for devices without Iowan Old Style; fetched only when used. */
    @font-face {
      font-family: "Literata";
      font-style: normal;
      font-weight: 200 900;
      font-display: swap;
      src: url("assets/fonts/literata-latin.woff2") format("woff2");
    }

    @font-face {
      font-family: "Literata";
      font-style: italic;
      font-weight: 200 900;
      font-display: swap;
      src: url("assets/fonts/literata-latin-italic.woff2") format("woff2");
    }

    :root {
      --bg: #0a0a0a;
      --text: #e4dfd5;
      --prose: #d3cec4;
      --muted: #a8a399;
      --dim: #85817a;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Iowan Old Style", "Literata", "Palatino Linotype", Palatino, Georgia, serif;
      line-height: 1.65;
      overflow-x: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.12'/></svg>");
      opacity: 0.03;
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 10vh 7vw 12vh;
    }

    header {
      margin-bottom: 6vh;
    }

    h1 {
      margin: 0 0 0.2em 0;
      font-size: clamp(2.6rem, 6vw, 4.5rem);
      font-weight: 400;
      letter-spacing: -0.005em;
    }

    .subtitle {
      margin: 0 0 2em 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      gap: 1.4rem;
      flex-wrap: wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    nav a {
      color: var(--dim);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 0.15em;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    nav a:hover,
    nav a:focus {
      color: var(--text);
      border-color: var(--text);
    }

    .list {
      max-width: 640px;
      font-size: 1.1875rem;
      color: var(--prose);
    }

    .group {
      margin-bottom: 3em;
    }

    .group h2 {
      margin: 0 0 0.8em 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .group ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .group li {
      margin: 0.6em 0;
    }

    .group a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 0.1em;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .group a:hover,
    .group a:focus {
      color: var(--text);
      border-color: var(--text);
    }

    .group-desc {
      margin: -0.4em 0 1em 0;
      font-size: 0.85rem;
      color: var(--dim);
    }

    @media (max-width: 600px) {
      .page {
        padding-top: 9vh;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>The Cabin</h1>
      <p class="subtitle">Stories</p>
      <nav>
        <a href="index.html">Home</a>
        <a href="game.html">Game</a>
        <a href="https://github.com/amomand/the-cabin">Repository</a>
      </nav>
    </header>

    <section class="list">
      <div class="group">
        <h2>The Cabin</h2>
        <ul>
          <li><a href="no-further.html">No Further</a></li>
          <li><a href="the-cabin.html">The Cabin</a></li>
        </ul>
      </div>
    </section>
  </div>
</body>
</html>
