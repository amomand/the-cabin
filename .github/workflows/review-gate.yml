name: Independent review gate

on:
  pull_request_target:
    types: [opened, edited, labeled, unlabeled, reopened, synchronize, ready_for_review, converted_to_draft]
  schedule:
    # Hosted reviewers are bot actors, and their review events do not reliably
    # start workflow runs. Sweep every open pull request instead so a review
    # that lands without a new push still clears the gate on its own.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: independent-review-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Evaluate routine label or current-head outside review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const gate = require('./.github/scripts/independent-review-gate.cjs');
            const pullRequest = context.payload.pull_request;
            if (pullRequest) {
              await gate({ github, context, core, pullRequest });
              return;
            }
            await gate.sweep({ github, context, core });
